name: projects-stage

services:
  db:
    image: postgres:15
    container_name: postgres_projects_stage
    restart: unless-stopped
    volumes:
      - /mnt/quidpath-projects-db-stage/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projects_network
      - quidpath_network

  backend:
    image: ${IMAGE_TAG}
    container_name: projects-backend-stage
    restart: unless-stopped
    ports:
      - "127.0.0.1:8021:8007"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      PROJECTS_SERVICE_SECRET: ${PROJECTS_SERVICE_SECRET}
      INVENTORY_SERVICE_URL: http://inventory-backend-stage:8000
      INVENTORY_SERVICE_SECRET: ${INVENTORY_SERVICE_SECRET}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      ERP_BACKEND_URL: ${ERP_BACKEND_URL}
      HRM_SERVICE_URL: ${HRM_SERVICE_URL}
      CRM_SERVICE_URL: ${CRM_SERVICE_URL}
      REDIS_URL: ${REDIS_URL}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      DJANGO_SETTINGS_MODULE: projects_service.settings.stage
      DJANGO_ENV: stage
    volumes:
      - /mnt/quidpath-projects-stage-data/media:/app/media
      - /mnt/quidpath-projects-stage-data/staticfiles:/app/staticfiles
    networks:
      - projects_network
      - quidpath_network

networks:
  projects_network:
    name: projects_stage_network
    driver: bridge
  quidpath_network:
    external: true
    name: stage_quidpath_network
