name: Build Stage Image & Deploy (Projects)

on:
  push:
    branches: ["Development"]

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/quidpath_projects:stage-${TIMESTAMP}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.stage
          push: true
          tags: ${{ steps.tag.outputs.image_tag }}
          platforms: linux/amd64,linux/arm64/v8

      - name: Encode docker-compose.stage.yml
        id: compose
        run: echo "b64=$(base64 -w 0 docker-compose.stage.yml)" >> $GITHUB_OUTPUT

      - name: Prepare secrets payload
        id: secrets
        run: |
          json="{}"
          add() { json=$(echo "$json" | jq --arg k "$1" --arg v "$2" '.[$k]=$v'); }

          add SECRET_KEY "${{ secrets.SECRET_KEY }}"
          add JWT_SECRET_KEY "${{ secrets.JWT_SECRET_KEY }}"
          # Own secret
          add PROJECTS_SERVICE_SECRET "${{ secrets.PROJECTS_SERVICE_SECRET }}"
          # Cross-service secrets
          add ERP_SERVICE_SECRET "${{ secrets.ERP_SERVICE_SECRET }}"
          add INVENTORY_SERVICE_SECRET "${{ secrets.INVENTORY_SERVICE_SECRET }}"
          add POS_SERVICE_SECRET "${{ secrets.POS_SERVICE_SECRET }}"
          add CRM_SERVICE_SECRET "${{ secrets.CRM_SERVICE_SECRET }}"
          add HRM_SERVICE_SECRET "${{ secrets.HRM_SERVICE_SECRET }}"
          add BILLING_SERVICE_SECRET "${{ secrets.BILLING_SERVICE_SECRET }}"
          # Database
          add POSTGRES_DB "${{ secrets.PROJECTS_POSTGRES_DB_STAGE }}"
          add POSTGRES_USER "${{ secrets.PROJECTS_POSTGRES_USER_STAGE }}"
          add POSTGRES_PASSWORD "${{ secrets.PROJECTS_POSTGRES_PASSWORD_STAGE }}"
          add DATABASE_URL "${{ secrets.PROJECTS_DATABASE_URL_STAGE }}"
          add DB_NAME "${{ secrets.PROJECTS_POSTGRES_DB_STAGE }}"
          add DB_USER "${{ secrets.PROJECTS_POSTGRES_USER_STAGE }}"
          add DB_PASSWORD "${{ secrets.PROJECTS_POSTGRES_PASSWORD_STAGE }}"
          add DB_HOST "db"
          add DB_PORT "5432"
          # Service URLs
          add ALLOWED_HOSTS "stage-projects.quidpath.com,stage-api.quidpath.com,localhost,127.0.0.1,0.0.0.0,projects-backend-stage,projects-backend"
          add ERP_BACKEND_URL "http://quidpath-backend-stage:8004"
          add HRM_SERVICE_URL "http://hrm-backend-stage:8000"
          add CRM_SERVICE_URL "http://crm-backend-stage:8000"
          add INVENTORY_SERVICE_URL "http://inventory-backend-stage:8000"
          add REDIS_URL "redis://redis:6379/0"
          add SMTP_USER "${{ secrets.SMTP_USER }}"
          add SMTP_PASSWORD "${{ secrets.SMTP_PASSWORD }}"
          add DJANGO_SETTINGS_MODULE "projects_service.settings.stage"

          echo "secrets_json=$(echo $json | jq -c .)" >> $GITHUB_OUTPUT

      - name: Trigger deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_PAT }}
          repository: stevendegwa/infra
          event-type: deploy-app
          client-payload: |
            {
              "app_repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "env": "stage",
              "sha": "${{ github.sha }}",
              "image_tag": "${{ steps.tag.outputs.image_tag }}",
              "docker_compose_b64": "${{ steps.compose.outputs.b64 }}",
              "env_secrets": ${{ steps.secrets.outputs.secrets_json }}
            }
